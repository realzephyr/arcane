[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcane"
version = "0.2.0"
description = "A scalable framework for AI-powered conversational Discord bots with persistent personalities and memory."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arcane contributors" }]
keywords = ["discord", "bot", "ai", "llm", "ollama", "chatbot", "personality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "discord.py>=2.4,<3",
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.20,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
]

[project.scripts]
arcane = "arcane.cli:main"

[tool.setuptools.packages.find]
include = ["arcane*"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "logs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "ASYNC",# async pitfalls
    "RUF",  # ruff-specific
    "S",    # bandit (security)
    "PTH",  # prefer pathlib
]
ignore = [
    "S311", # `random` is fine: it drives human-like variation, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Regex tables: splitting long patterns across lines makes them harder to audit.
"arcane/ai/guards.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["arcane"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["^build/", "^data/", "^logs/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::RuntimeWarning",
    # discord.py imports audioop for voice support, which Arcane does not use.
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
